spring:
  application:
    name: beauty-mart-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID}
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: ${JWT_EXPIRATION:PT12H}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:3000}
  mailgun:
    api-key: ${MAILGUN_API_KEY:}
    domain: ${MAILGUN_DOMAIN:}
    from: ${MAILGUN_FROM:}
    admin-email: ${MAILGUN_ADMIN_EMAIL:}
    base-url: ${MAILGUN_BASE_URL:https://api.mailgun.net}

server:
  port: ${PORT:8080}
